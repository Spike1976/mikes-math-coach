plugins { id 'com.android.application' }

def stableTestKeystore = rootProject.file('ci/mikes-math-test.keystore')
def uploadKeystorePath = System.getenv('MATH_UPLOAD_KEYSTORE')

android {
    namespace 'com.mikesmathcoach'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mikesmathcoach.test'
        minSdk 23
        targetSdk 36
        versionCode 30
        versionName '2.0.0'
    }

    signingConfigs {
        stableTest {
            if (stableTestKeystore.exists()) {
                storeFile stableTestKeystore
                storePassword 'mikesmathdebug'
                storeType 'JKS'
                keyAlias 'mikesmathdebug'
                keyPassword 'mikesmathdebug'
            }
        }
    }

    signingConfigs {
        productionUpload {
            if (uploadKeystorePath) {
                storeFile file(uploadKeystorePath)
                storePassword System.getenv('MATH_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('MATH_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('MATH_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
        release {
            if (uploadKeystorePath) signingConfig signingConfigs.productionUpload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}