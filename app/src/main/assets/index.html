<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M15 46V18h9l8 14 8-14h9v28h-9V32l-8 13-8-13v14z' fill='%23ff861f'/%3E%3C/svg%3E">
  <title>Mike's Math Coach</title>
  <style>
    :root{--bg:#07111f;--panel:#101e31;--panel2:#16283e;--text:#f6f9ff;--muted:#a9b8cd;--orange:#ff861f;--blue:#4da3ff;--good:#49d78e;--bad:#ff6b72;--line:#29415e}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#173252 0,var(--bg) 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    button{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 110px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.03em}.brand span{color:var(--orange)}
    .streak{font-size:.9rem;color:var(--muted);background:#0b1727;border:1px solid var(--line);padding:8px 11px;border-radius:99px}
    .progress{height:9px;background:#1b2d44;border-radius:10px;overflow:hidden;margin-bottom:22px}.progress i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--orange),var(--blue));transition:.35s}
    .card{background:linear-gradient(180deg,var(--panel),#0d1929);border:1px solid var(--line);box-shadow:0 18px 60px #0008;border-radius:22px;padding:22px}
    .eyebrow{color:var(--blue);font-size:.78rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
    h1{font-size:clamp(1.45rem,6vw,2rem);line-height:1.15;margin:0 0 12px}.prompt{color:var(--muted);font-size:1.05rem;line-height:1.5;margin:0 0 20px}
    .formula{font:700 clamp(2rem,10vw,3.25rem) Georgia,serif;text-align:center;background:#071321;border:1px solid #24405f;border-radius:18px;padding:22px 12px;margin:18px 0}.formula .focus{color:var(--orange);text-shadow:0 0 22px #ff861f55}
    .answers{display:grid;gap:11px}.choice{width:100%;min-height:62px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 16px;border-radius:15px;text-align:left;font-weight:750;display:flex;align-items:center;gap:13px;cursor:pointer}
    .choice b{display:grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:#0a1625;color:var(--orange)}.choice:active{transform:scale(.985)}
    .choice.correct{border-color:var(--good);background:#123a30}.choice.wrong{border-color:var(--bad);background:#3a1c28}
    .coach{margin-top:15px;padding:16px;border-radius:15px;background:#0a1727;border-left:5px solid var(--orange);line-height:1.5}.coach strong{color:var(--orange)}
    .next{width:100%;border:0;border-radius:15px;background:var(--orange);color:#101010;font-weight:900;padding:17px;margin-top:15px;cursor:pointer}
    .next:disabled{opacity:.35}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}
    .mini{display:flex;gap:9px;margin-top:14px}.mini button{flex:1;padding:11px;border-radius:12px;background:#0b1727;color:var(--muted);border:1px solid var(--line)}
    .home{text-align:center}.home .icon{font-size:3rem;margin:6px}.home ul{text-align:left;color:var(--muted);line-height:1.55;padding-left:22px}.home .next{font-size:1.08rem}
    .scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.scoregrid div{background:#0a1727;border-radius:13px;padding:12px 5px;text-align:center}.scoregrid b{display:block;font-size:1.25rem;color:var(--orange)}.scoregrid small{color:var(--muted)}
    .hidden{display:none!important}@media(max-width:400px){.card{padding:18px}.formula{font-size:2rem}}
    .level{margin:20px 0 8px;text-align:left;color:var(--orange);font-weight:900;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}.badge{font-size:.72rem;color:var(--good);margin-left:auto}.choice span{width:100%}
    .supportLink{display:inline-block;margin-top:24px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}.cashButton{display:block;text-decoration:none;background:#00d64f;color:#04170a;font-weight:950;padding:17px;border-radius:15px;margin-top:16px}.qrCrop{position:relative;overflow:hidden;aspect-ratio:1;width:min(100%,340px);margin:18px auto;border-radius:22px;background:#fff;border:4px solid #fff}.qrCrop img{position:absolute;width:108.9%;max-width:none;left:-4.6%;top:-75.8%}
    .topnav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:-10px 0 14px}.topnav button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#0b1727;color:var(--text);font-weight:800}.pathbox{text-align:left;background:#091727;border:1px solid var(--line);border-radius:16px;padding:15px;margin:14px 0}.pathbox strong{color:var(--orange)}
    .teach{background:#102842;border:1px solid #2f5c88;border-radius:16px;padding:16px;margin:10px 0 18px;line-height:1.55}.teach h2{font-size:.88rem;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);margin:0 0 8px}.teach p{margin:0}.examples{margin-top:11px;padding-top:11px;border-top:1px solid #2f5c88;color:#d8e8fa}.questionLabel{font-size:.78rem;font-weight:900;color:var(--orange);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
    .profileGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.profileStat,.topicRow{background:#0a1727;border:1px solid var(--line);border-radius:14px;padding:13px}.profileStat b{display:block;font-size:1.45rem;color:var(--orange)}.profileStat small{color:var(--muted)}.topicRow{margin:9px 0;text-align:left}.topicRow strong{display:flex;justify-content:space-between;gap:10px}.meter{height:7px;background:#1b2d44;border-radius:8px;overflow:hidden;margin-top:9px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--orange),var(--good))}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:#0a1727;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.toggle{min-width:88px;border:1px solid var(--line);border-radius:99px;padding:9px 12px;font-weight:900;background:#301a1a;color:#ffd8d8}.toggle.on{background:#123a30;color:#caffdf}.styleBtn.selected{border-color:var(--orange);box-shadow:0 0 0 2px #ff861f44}.diagNote{background:#0a1727;border:1px solid var(--line);padding:13px;border-radius:14px;color:var(--muted);margin:12px 0}.diagResult{font-size:1.1rem;text-align:left;background:#091727;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  </style>
</head>
<body><main class="app">
  <header><div class="brand"><span>MIKE'S</span> MATH COACH</div><div class="streak" id="streak">🔥 0 mastered</div></header>
  <nav class="topnav" style="grid-template-columns:1fr 1fr 1fr"><button onclick="home()">🏠 Main</button><button onclick="backStep()">← Back</button><button onclick="showSettings()">⚙ Settings</button></nav>
  <div class="progress"><i id="bar"></i></div>
  <section class="card" id="screen"></section>
</main>
<script>
const functionLesson=[
 {tag:"Read the symbols",q:"In f(3), what does the 3 tell us?",formula:"f(<span class='focus'>3</span>)",a:["It tells us x = 3","It means 3 × 3","It is the answer"],ok:0,why:"The number inside the parentheses is the <strong>input</strong>. It takes the empty parking spot called x. So here, x becomes 3."},
 {tag:"Replace x",q:"If f(x) = 2x² − 1 and we need f(3), what replaces x?",formula:"2(<span class='focus'>3</span>)² − 1",a:["2","3","−1"],ok:1,why:"Exactly. f(3) tells us to park <strong>3 in every x spot</strong>."},
 {tag:"Understand the little ²",q:"What does the raised ² tell us to do to 3?",formula:"<span class='focus'>3²</span>",a:["Multiply 3 × 2","Add 3 + 2","Multiply 3 × 3"],ok:2,why:"A raised ² means multiply the number by <strong>itself</strong>. So 3² is 3 × 3, which equals 9."},
 {tag:"Square first",q:"What does 3² become?",formula:"3² = <span class='focus'>?</span>",a:["6","9","33"],ok:1,why:"Right: <strong>3 × 3 = 9</strong>. The raised ² now disappears because we have completed its instruction."},
 {tag:"Bring the formula back",q:"After changing 3² into 9, what is left?",formula:"2(3²) − 1",a:["2(9) − 1","6² − 1","2(3) − 1"],ok:0,why:"We changed only the squared part. Everything else stays put: <strong>2 × 9 − 1</strong>."},
 {tag:"Multiply",q:"Now multiply 2 × 9. What do you get?",formula:"<span class='focus'>2 × 9</span> − 1",a:["11","18","29"],ok:1,why:"Yes. The normal-size 2 in front is a multiplier: <strong>2 × 9 = 18</strong>."},
 {tag:"Finish it",q:"One last move: 18 − 1 equals what?",formula:"<span class='focus'>18 − 1</span>",a:["17","18","19"],ok:0,why:"Correct. The output is <strong>f(3) = 17</strong>. You solved every piece yourself."},
 {tag:"Try a new input",q:"For f(4), what number replaces x?",formula:"f(<span class='focus'>4</span>) = 2x² − 1",a:["2","4","16"],ok:1,why:"Correct. The number inside f( ) becomes x. This time x = 4."},
 {tag:"Square the new input",q:"What does 4² become?",formula:"4² = <span class='focus'>?</span>",a:["8","16","44"],ok:1,why:"Exactly: <strong>4 × 4 = 16</strong>."},
 {tag:"Put it together",q:"Solve 2 × 16 − 1.",formula:"2 × 16 − 1",a:["31","32","17"],ok:0,why:"You got it: 2 × 16 = 32, then 32 − 1 = <strong>31</strong>."}
];
const lessonBanks={
 functions:{name:"Functions & squares",desc:"Understand f(x), inputs, x, and exponents.",steps:functionLesson},
 order:{name:"Order of operations",desc:"Know what to calculate first and why.",steps:[
  {tag:"Read the road signs",q:"In 3 + 2 × 4, which operation goes first?",formula:"3 + <span class='focus'>2 × 4</span>",a:["3 + 2","2 × 4","Whichever looks easier"],ok:1,why:"Multiplication goes before addition. Think of × as having <strong>priority clearance</strong>."},
  {tag:"Do one move",q:"What is 2 × 4?",formula:"3 + (<span class='focus'>2 × 4</span>)",a:["6","8","12"],ok:1,why:"Correct. 2 groups of 4 make <strong>8</strong>."},
  {tag:"Bring it back",q:"After replacing 2 × 4 with 8, what remains?",formula:"3 + 2 × 4",a:["3 + 8","5 × 4","3 + 2"],ok:0,why:"Only the completed piece changes. Now we have <strong>3 + 8</strong>."},
  {tag:"Finish",q:"What is 3 + 8?",formula:"<span class='focus'>3 + 8</span>",a:["10","11","24"],ok:1,why:"Yes. 3 + 2 × 4 equals <strong>11</strong>, not 20."}]},
 equations:{name:"Solve for x",desc:"Undo operations one careful step at a time.",steps:[
  {tag:"What is x?",q:"In x + 3 = 8, what are we trying to find?",formula:"<span class='focus'>x</span> + 3 = 8",a:["A number that makes it true","A multiplication sign","Always zero"],ok:0,why:"x is an unknown number. We need the number that makes both sides <strong>equal</strong>."},
  {tag:"Undo +3",q:"What is the opposite of adding 3?",formula:"x <span class='focus'>+ 3</span> = 8",a:["Add 3","Subtract 3","Multiply by 3"],ok:1,why:"Subtraction undoes addition, like backing out of a parking space."},
  {tag:"Keep it balanced",q:"If we subtract 3 on the left, what must we do on the right?",formula:"x + 3 − 3 = 8 <span class='focus'>?</span> 3",a:["Add","Subtract","Ignore"],ok:1,why:"An equation is a balanced scale. Whatever you do to one side, do to the other."},
  {tag:"Solve",q:"What is 8 − 3?",formula:"x = <span class='focus'>8 − 3</span>",a:["5","6","11"],ok:0,why:"So <strong>x = 5</strong>. Check it: 5 + 3 equals 8."}]},
 negatives:{name:"Negative numbers",desc:"Make below-zero numbers feel natural.",steps:[
  {tag:"Number line",q:"Which number is farther left?",formula:"<span class='focus'>−5</span> · · · −2",a:["−5","−2","They are equal"],ok:0,why:"Numbers get smaller as you travel left. So −5 is less than −2."},
  {tag:"Debt example",q:"You owe $5 and pay back $2. How much do you still owe?",formula:"−5 + 2 = <span class='focus'>?</span>",a:["−7","−3","3"],ok:1,why:"You moved 2 steps toward zero, from −5 to <strong>−3</strong>."},
  {tag:"Direction",q:"Starting at −3, subtracting 2 moves which way?",formula:"−3 − 2",a:["Left","Right","Nowhere"],ok:0,why:"Subtracting moves left. Two steps left from −3 lands at −5."},
  {tag:"Finish",q:"What is −3 − 2?",formula:"−3 − 2 = <span class='focus'>?</span>",a:["−5","−1","5"],ok:0,why:"Correct: <strong>−5</strong>."}]},
 fractions:{name:"Fractions without fear",desc:"See fractions as ordinary pieces and division.",steps:[
  {tag:"Read it",q:"In 3/4, what does the bottom 4 mean?",formula:"3 / <span class='focus'>4</span>",a:["Four equal pieces make the whole","We own four pieces","Multiply by four"],ok:0,why:"The bottom number tells how many <strong>equal pieces</strong> make one whole."},
  {tag:"Count pieces",q:"What does the top 3 mean?",formula:"<span class='focus'>3</span> / 4",a:["The size of each piece","How many pieces we have","Always divide by 3"],ok:1,why:"The top number counts the pieces we have: <strong>3 of 4</strong>."},
  {tag:"Add pieces",q:"What is 1/4 + 2/4?",formula:"1/4 + 2/4",a:["3/4","3/8","2/4"],ok:0,why:"The pieces are the same size, so count them: 1 + 2 = <strong>3 pieces</strong>."},
  {tag:"Piece size",q:"Why does the bottom stay 4?",formula:"1/4 + 2/4 = 3/<span class='focus'>4</span>",a:["They are still fourth-size pieces","Because 1 + 2 = 4","It should be 8"],ok:0,why:"Adding slices does not change their size. Fourths remain <strong>fourths</strong>."}]}
};
Object.assign(lessonBanks,{
 squaresdeep:{name:"Squaring—understand it completely",desc:"Learn the base, the raised ², and square many different kinds of numbers.",level:"FOUNDATIONS",steps:[
  {tag:"Two different jobs",q:"In 6², which number is being squared?",formula:"<span class='focus'>6</span>²",a:["6","2","12"],ok:0,why:"The regular-size number <strong>6 is the base</strong>. That is the number being squared."},
  {tag:"The instruction",q:"In 6², what job does the little raised ² have?",formula:"6<span class='focus'>²</span>",a:["It tells us to multiply 6 by itself","It tells us to multiply 6 by 2","It changes 6 into 2"],ok:0,why:"The raised ² is an <strong>instruction</strong>: use two copies of the base. It does not mean the base is always 2."},
  {tag:"Write it longhand",q:"Which correctly expands 6²?",formula:"6² = ?",a:["6 × 6","6 × 2","6 + 2"],ok:0,why:"Two copies of the base means <strong>6 × 6</strong>."},
  {tag:"Square 2",q:"What is 2²?",formula:"<span class='focus'>2 × 2</span>",a:["4","2","6"],ok:0,why:"2² means 2 × 2, so it equals <strong>4</strong>."},
  {tag:"Square 3",q:"What is 3²?",formula:"<span class='focus'>3 × 3</span>",a:["6","9","5"],ok:1,why:"3² means 3 × 3, so it equals <strong>9</strong>."},
  {tag:"Square 4",q:"What is 4²?",formula:"<span class='focus'>4 × 4</span>",a:["8","16","6"],ok:1,why:"4² means 4 × 4, so it equals <strong>16</strong>."},
  {tag:"Square 5",q:"What is 5²?",formula:"<span class='focus'>5 × 5</span>",a:["10","20","25"],ok:2,why:"5² means 5 × 5, so it equals <strong>25</strong>."},
  {tag:"Square 8",q:"What is 8²?",formula:"<span class='focus'>8 × 8</span>",a:["16","64","88"],ok:1,why:"8² means 8 × 8, so it equals <strong>64</strong>."},
  {tag:"Square 10",q:"What is 10²?",formula:"<span class='focus'>10 × 10</span>",a:["20","100","12"],ok:1,why:"10² means 10 × 10, so it equals <strong>100</strong>."},
  {tag:"Square zero",q:"Can zero be squared?",formula:"0² = <span class='focus'>0 × 0</span>",a:["Yes, it equals 0","No","Yes, it equals 2"],ok:0,why:"Yes. <strong>Any number can be squared</strong>. Zero times zero is zero."},
  {tag:"Square one",q:"What is 1²?",formula:"<span class='focus'>1 × 1</span>",a:["1","2","0"],ok:0,why:"1² is 1 × 1, which remains <strong>1</strong>."},
  {tag:"A larger number",q:"What does 12² mean?",formula:"12²",a:["12 × 12","12 × 2","12 + 2"],ok:0,why:"The meaning never changes: 12² means <strong>12 × 12</strong>."},
  {tag:"Negative base",q:"What does (−3)² mean?",formula:"(−3)²",a:["(−3) × (−3)","−3 × 2","3 × 2"],ok:0,why:"The entire number in parentheses is the base. A negative times a negative is positive, so (−3)² = 9."},
  {tag:"The rule",q:"Which statement is true?",formula:"n² = n × n",a:["Any number can be squared","Only 2 and 3 can be squared","Squaring always means × 2"],ok:0,why:"Correct. <strong>Any number can be squared.</strong> The little ² always says: multiply that number by itself."},
  {tag:"Prove it",q:"Final check: what is 7²?",formula:"<span class='focus'>7 × 7</span>",a:["14","49","72"],ok:1,why:"You applied the rule to a new number: 7 × 7 = <strong>49</strong>."}
 ]},
 algebra:{name:"Algebra foundations",desc:"Variables, expressions, equations, inequalities.",level:"FOUNDATIONS",steps:[
  {tag:"Variable",q:"What is a variable?",formula:"<span class='focus'>x</span> + 4",a:["A letter holding a number","A multiplication sign","A permanent answer"],ok:0,why:"A variable is a named parking spot for a number."},
  {tag:"Like terms",q:"Which terms can combine?",formula:"3x + 2 + 4x",a:["3x and 4x","3x and 2","All three"],ok:0,why:"3x and 4x are the same kind of item, so they combine into 7x."},
  {tag:"Equation",q:"Solve x + 4 = 9 by undoing +4.",formula:"x = 9 − 4",a:["5","13","4"],ok:0,why:"9 − 4 = 5, and checking gives 5 + 4 = 9."},
  {tag:"Inequality",q:"What does x > 5 mean?",formula:"x <span class='focus'>&gt;</span> 5",a:["x is greater than 5","x equals 5","x is less than 5"],ok:0,why:"The wide-open side points toward the larger value."}]},
 geometry:{name:"Geometry & trigonometry",desc:"Shapes, angles, distance, sine, cosine, tangent.",level:"FOUNDATIONS",steps:[
  {tag:"Area",q:"A rectangle is 5 ft long and 3 ft wide. Its area is?",formula:"5 × 3",a:["8 ft","15 ft²","16 ft²"],ok:1,why:"Area counts square units: 5 rows of 3 makes 15 square feet."},
  {tag:"Right triangles",q:"Which theorem connects the three sides of a right triangle?",formula:"a² + b² = c²",a:["Pythagorean theorem","PEMDAS","Quadratic formula"],ok:0,why:"The Pythagorean theorem relates the two legs to the hypotenuse."},
  {tag:"Sine",q:"In a right triangle, sine is opposite divided by what?",formula:"sin θ = opposite / ?",a:["Adjacent","Hypotenuse","Angle"],ok:1,why:"SOH: Sine = Opposite over Hypotenuse."},
  {tag:"Cosine",q:"In SOH-CAH-TOA, CAH means?",formula:"cos θ = ? / ?",a:["Adjacent / Hypotenuse","Opposite / Adjacent","Hypotenuse / Adjacent"],ok:0,why:"CAH: Cosine = Adjacent over Hypotenuse."}]},
 precalc:{name:"Precalculus",desc:"Functions, graphs, exponents, logarithms, limits preview.",level:"COLLEGE MATH",steps:[
  {tag:"Graph",q:"On a graph, what does f(2) describe?",formula:"y = f(<span class='focus'>2</span>)",a:["The y-value when x is 2","The x-axis length","Always 2"],ok:0,why:"Put 2 into the function; the output tells the graph's height there."},
  {tag:"Exponent",q:"What does 2³ mean?",formula:"2³",a:["2 × 3","2 × 2 × 2","3 × 3"],ok:1,why:"The exponent counts how many copies of the base are multiplied."},
  {tag:"Logarithm",q:"log₂(8) asks: 2 raised to what power equals 8?",formula:"2? = 8",a:["2","3","4"],ok:1,why:"2³ = 8, so log₂(8) = 3."},
  {tag:"Approach",q:"A limit asks what value a function does what toward?",formula:"lim x→a f(x)",a:["Approaches","Deletes","Multiplies"],ok:0,why:"A limit studies where the output is heading as the input approaches a value."}]},
 calc1:{name:"Calculus I",desc:"Limits, derivatives, rates of change, basic integrals.",level:"CALCULUS",steps:[
  {tag:"Limit",q:"What does a limit measure?",formula:"lim x→3 f(x)",a:["Where f(x) is heading","Only the exact value at 3","The graph's color"],ok:0,why:"A limit watches the destination, even if the function has a hole there."},
  {tag:"Derivative",q:"A derivative mainly measures what?",formula:"f′(x)",a:["Instantaneous rate of change","Total area only","A random point"],ok:0,why:"It is the speedometer of a function: how fast the output changes right now."},
  {tag:"Slope",q:"If position changes 60 miles in 1 hour, average rate is?",formula:"60 miles / 1 hour",a:["30 mph","60 mph","61 mph"],ok:1,why:"Rate is change in distance divided by change in time."},
  {tag:"Integral",q:"A basic definite integral often represents what?",formula:"∫ f(x) dx",a:["Accumulated total or area","One isolated point","A variable name"],ok:0,why:"An integral adds infinitely thin slices to find accumulated quantity."}]},
 calc2:{name:"Calculus II",desc:"Integration techniques, sequences, series, convergence.",level:"CALCULUS",steps:[
  {tag:"Accumulation",q:"Integration by substitution is most like what?",formula:"u = g(x)",a:["Renaming a complicated inner piece","Deleting x","Guessing an answer"],ok:0,why:"Substitution gives a messy repeated piece a simpler name."},
  {tag:"Sequence",q:"A sequence is best described as?",formula:"a₁, a₂, a₃, …",a:["An ordered list of numbers","A geometric shape","One equation only"],ok:0,why:"A sequence is a numbered list whose terms follow a rule."},
  {tag:"Series",q:"A series is what?",formula:"a₁ + a₂ + a₃ + …",a:["Terms of a sequence added","Terms subtracted only","A graph axis"],ok:0,why:"A series asks what happens when sequence terms are accumulated."},
  {tag:"Convergence",q:"If partial sums settle near one finite number, the series?",formula:"Sₙ → L",a:["Converges","Explodes","Has no terms"],ok:0,why:"Converge means the running total approaches a finite destination."}]},
 calc3:{name:"Calculus III",desc:"Vectors, partial derivatives, multiple integrals.",level:"CALCULUS",steps:[
  {tag:"Three dimensions",q:"A point in 3D needs how many coordinates?",formula:"(x, y, z)",a:["2","3","4"],ok:1,why:"x, y, and z locate left-right, forward-back, and up-down."},
  {tag:"Partial derivative",q:"When finding ∂f/∂x, what happens to y?",formula:"f(x,y)",a:["Treat y as constant","Delete y always","Differentiate only y"],ok:0,why:"A partial derivative changes one input while temporarily holding the others still."},
  {tag:"Gradient",q:"The gradient points toward?",formula:"∇f",a:["Steepest increase","Steepest decrease only","The origin always"],ok:0,why:"The gradient is an uphill arrow pointing in the direction of fastest increase."},
  {tag:"Double integral",q:"A double integral adds tiny pieces across?",formula:"∬ᴿ f(x,y)dA",a:["A region or surface","Only a line","One number"],ok:0,why:"It accumulates over two input dimensions instead of one."}]},
 linear:{name:"Linear algebra",desc:"Vectors, matrices, transformations, eigenvalues.",level:"AI MATHEMATICS",steps:[
  {tag:"Vector",q:"What does the vector [3, 4] contain?",formula:"[<span class='focus'>3, 4</span>]",a:["Ordered numbers that can describe direction and magnitude","Only one letter","An equation sign"],ok:0,teach:"A <strong>vector is an ordered list of numbers</strong>. In [3, 4], the 3 is first and the 4 is second. For movement, it can mean 3 steps right and 4 steps up. The brackets keep the values together, and the order matters.",hint:"This is a notation question, not a calculation. Ask what the brackets are grouping and why the order matters.",why:"Correct. [3, 4] is an ordered pair. It can describe 3 units across and 4 units up, giving both direction and size."},
  {tag:"Matrix",q:"A matrix is?",formula:"[ 1  2 ; 3  4 ]",a:["A rectangular grid of numbers","A single fraction","A curved line"],ok:0,why:"Matrices organize numbers and can represent data or transformations."},

function paintFormula(formula,tag){

 else if(tag==="Order of operations") painted=formula.replace(/(\d+\s*×\s*\d+)/,"<span class='focus'>$1</span>");

 return painted===formula?"<span class='focus'>"+formula+"</span>":painted;
}

t=>`<div class="topicRow"><strong><span>${lessonBanks[t.key]?.name||t.key}</span><span>${t.pct}%</span></strong><small>${t.right} correct out of ${t.total} attempts · ${t.hints} used hints</small><div class="meter"><i style="width:${t.pct}%"></i></div></div>`).join(""):'<p class="prompt">No answers recorded yet.</p>'}<button class="next quiet" onclick="home()">Return to main screen</button></div>`}

function preferredExplanation(l){
 if(preferredTeachingStyle==='plain')return ["Plain-English breakdown",deepExplain(l)];
 if(preferredTeachingStyle==='worked')return ["Worked example",workedExplain(l)];
 if(preferredTeachingStyle==='analogy'||preferredTeachingStyle==='real')return ["Real-life picture",analogyFor(l)+"<br><br>"+l.why];
 if(preferredTeachingStyle==='formula')return ["Rule first",`<strong>Rule:</strong> ${lessonTeaching(l)}<br><br><strong>Apply it:</strong> ${workedExplain(l)}`];
 if(preferredTeachingStyle==='why')return ["Why it works",deepExplain(l)];
 if(preferredTeachingStyle==='mistakes')return ["Common mistake check",`A common wrong move is to rush the symbol or operation. ${focusHint(l)}<br><br>${deepExplain(l)}`];
 if(preferredTeachingStyle==='memory')return ["Memory pattern",`${checklistExplain(l)}<br><br><strong>Memory cue:</strong> Say the operation's job aloud before calculating.`];
 if(preferredTeachingStyle==='challenge')return ["Challenge mode",`Try the problem before reading help. If stuck, use this single clue: ${focusHint(l)}`];
 if(preferredTeachingStyle==='visual')return ["Visual / spatial",`${analogyFor(l)}<br><br>Picture the quantities moving, grouping, or changing position before calculating.`];
 if(preferredTeachingStyle==='pattern')return ["Pattern discovery",`${exampleText(l)}<br><br>Compare the examples. Identify what changes and what rule stays the same.`];
 if(preferredTeachingStyle==='guided')return ["Guided questions",`1) What does the main symbol mean?<br>2) What operation must happen first?<br>3) What stays unchanged after that step?<br>4) Now calculate only that one step.`];
 if(preferredTeachingStyle==='study')return ["Read & study",`${deepExplain(l)}<br><br>${workedExplain(l)}`];
 if(preferredTeachingStyle==='audio')return ["Audio-first",`Use the Read whole lesson button, then solve the problem without rereading the explanation unless needed.`];
 return null;
}

 ()=>{let n=rnd(1,100);let ans=n%2===0?"Even":"Odd";return drillQ("Even & odd",`Is ${n} even or odd?`,`${n}`,ans,[ans==="Even"?"Odd":"Even","Neither"],`A number is even when it divides by 2 with no remainder. ${n} is <strong>${ans.toLowerCase()}</strong>.`)},
 ()=>{let n=rnd(11,999);let ans=Math.round(n/10)*10;return drillQ("Rounding",`Round ${n} to the nearest ten.`,`${n} ≈ ?`,ans,[Math.floor(n/10)*10,Math.ceil(n/100)*100],`Look at the ones digit and round to <strong>${ans}</strong>.`)},
 ()=>{let a=rnd(10,99),b=rnd(10,99),exact=a+b,est=Math.round(a/10)*10+Math.round(b/10)*10;return drillQ("Estimation",`Estimate ${a} + ${b} by rounding each to the nearest ten.`,`${Math.round(a/10)*10} + ${Math.round(b/10)*10}`,est,[exact,est+20],`Rounded values give an estimate of <strong>${est}</strong>.`)},
 ()=>{let a=rnd(0,99),b=rnd(0,99);return drillQ("Addition",`Solve ${a} + ${b}.`,`${a} + ${b}`,a+b,[a+b+1,Math.abs(a-b)],`Add ones, then tens. The answer is <strong>${a+b}</strong>.`)},
 ()=>{let a=rnd(20,120),b=rnd(0,a);return drillQ("Subtraction",`Solve ${a} − ${b}.`,`${a} − ${b}`,a-b,[a+b,a-b+1],`Subtract carefully. The answer is <strong>${a-b}</strong>.`)},
 ()=>{let a=rnd(0,12),b=rnd(0,12);return drillQ("Multiplication facts",`Solve ${a} × ${b}.`,`${a} × ${b}`,a*b,[a+b,a*b+1],`Multiplication is repeated equal groups: <strong>${a*b}</strong>.`)},
 ()=>{let b=rnd(1,12),q=rnd(0,12),a=b*q;return drillQ("Division facts",`Solve ${a} ÷ ${b}.`,`${a} ÷ ${b}`,q,[b,q+1],`${a} split into groups of ${b} gives <strong>${q}</strong>.`)},
 ()=>{let a=rnd(2,12),b=rnd(2,12),p=a*b;return drillQ("Fact families",`If ${a} × ${b} = ${p}, which division fact is also true?`,`${a} × ${b} = ${p}`,`${p} ÷ ${a} = ${b}`,[`${p} ÷ ${b} = ${p}`,`${a} ÷ ${b} = ${p}`],`Multiplication and division undo each other: <strong>${p} ÷ ${a} = ${b}</strong>.`)},
 ()=>{let dollars=rnd(1,20),cents=[0,25,50,75][rnd(0,3)],price=dollars+cents/100,pay=Math.ceil(price/5)*5,change=(pay-price).toFixed(2);return drillQ("Money",`An item costs ${price.toFixed(2)}. You pay ${pay.toFixed(2)}. How much change?`,`${pay.toFixed(2)} − ${price.toFixed(2)}`,`${change}`,[`${price.toFixed(2)}`,`${(Number(change)+1).toFixed(2)}`],`Subtract the cost from the amount paid: <strong>${change}</strong>.`)},
 ()=>{let h=rnd(1,4),m=[0,15,30,45][rnd(0,3)],add=[15,30,45,60][rnd(0,3)],total=h*60+m+add,hh=Math.floor(total/60),mm=total%60;return drillQ("Time",`It is ${h}:${String(m).padStart(2,'0')}. What time is it ${add} minutes later?`,`${add} minutes later`,`${hh}:${String(mm).padStart(2,'0')}`,[`${h}:${String((m+add)%60).padStart(2,'0')}`,`${hh+1}:${String(mm).padStart(2,'0')}`],`Add the minutes and regroup 60 minutes as an hour. Answer: <strong>${hh}:${String(mm).padStart(2,'0')}</strong>.`)},
 ()=>{let ft=rnd(1,12),ans=ft*12;return drillQ("Measurement conversion",`How many inches are in ${ft} feet?`,`${ft} × 12`,`${ans} inches`,[`${ft+12} inches`,`${ft} inches`],`Each foot has 12 inches, so ${ft} × 12 = <strong>${ans}</strong>.`)},
 ()=>{let d=[2,3,4,5,6,8,10][rnd(0,6)],n=rnd(1,d-1);return drillQ("Fraction meaning",`What does ${n}/${d} mean?`,`${n}/${d}`,`${n} of ${d} equal parts`,[`${d} of ${n} equal parts`,`${n} × ${d}`],`The top counts chosen parts; the bottom tells how many equal parts make the whole.`)},
 ()=>{let d=[2,4,5,10][rnd(0,3)],a=rnd(1,d-1),b=rnd(1,d-a),sum=a+b;return drillQ("Adding fractions",`Add ${a}/${d} + ${b}/${d}.`,`${a}/${d} + ${b}/${d}`,`${sum}/${d}`,[`${sum}/${d*2}`,`${a*b}/${d}`],`Same-size pieces keep the same denominator. Add the numerators: <strong>${sum}/${d}</strong>.`)},
 ()=>{let whole=rnd(1,99),tenths=rnd(0,9),n=Number(`${whole}.${tenths}`),add=rnd(1,20)/10,ans=(n+add).toFixed(1);return drillQ("Decimals",`Solve ${n.toFixed(1)} + ${add.toFixed(1)}.`,`${n.toFixed(1)} + ${add.toFixed(1)}`,ans,[(n+add+1).toFixed(1),(n+add-.1).toFixed(1)],`Line up decimal places. The answer is <strong>${ans}</strong>.`)},
 ()=>{let whole=[20,40,60,80,100,200][rnd(0,5)],pct=[10,25,50][rnd(0,2)],ans=whole*pct/100;return drillQ("Percent basics",`What is ${pct}% of ${whole}?`,`${pct}/100 × ${whole}`,ans,[whole-pct,pct],`${pct}% means ${pct} per 100. The answer is <strong>${ans}</strong>.`)},

 ()=>{let a=rnd(1,15),b=rnd(1,15);return drillQ("Negative numbers",`Solve −${a} + ${b}.`,`−${a} + ${b}`,-a+b,[-a-b,a+b],`Start at −${a} and move ${b} steps right. Answer: <strong>${-a+b}</strong>.`)},
 ()=>{let base=rnd(2,10);return drillQ("Exponents basics",`What does ${base}² mean?`,`${base}²`,`${base} × ${base}`,[`${base} × 2`,`${base} + 2`],`A raised 2 means multiply the base by itself.`)},
 ()=>{let r=rnd(2,12),sq=r*r;return drillQ("Square roots basics",`What is √${sq}?`,`√${sq}`,r,[sq,r+1],`The square root is the positive number that squares to ${sq}: <strong>${r}</strong>.`)},
 ()=>{let a=rnd(1,9),b=rnd(2,9),c=rnd(1,9),ans=a+b*c;return drillQ("Order of operations",`Solve ${a} + ${b} × ${c}.`,`${a} + ${b} × ${c}`,ans,[(a+b)*c,a+b+c],`Multiply first, then add. The answer is <strong>${ans}</strong>.`)},

]}

 many different numbers</li><li>Missed ideas return before mastery</li></ul><button class="supportLink" onclick="showSupport()">♡ Voluntarily support this free tutor</button></div>`;
}
function showSupport(){bar.style.width='0%';screen.innerHTML=`<div class="home"><div class="eyebrow">Keep the tutor growing</div><h1>Support Mike’s Math Coach</h1><p class="prompt">The tutor is free. If it helps you, optional personal support helps pay for new lessons and improvements.</p><div class="qrCrop" style="display:flex;align-items:center;justify-content:center;min-height:120px"><strong style="font-size:1.4rem">$spikestokes</strong></div><a class="cashButton" href="https://cash.app/\$spikestokes" target="_blank" rel="noopener">Open Cash App · \$spikestokes</a><p style="color:var(--muted);font-size:.85rem;line-height:1.45">Support is voluntary. It does not purchase lessons, unlock features, or represent a tax-deductible charitable donation.</p><button class="next quiet" onclick="home()">Back to learning</button></div>`}
function startGuided(){let i=+(localStorage.guidedIndex||0);if(i>=guidedOrder.length)i=0;guidedMode=true;start(guidedOrder[i],true)}
function shuffleStep(original){const l={...original,a:[...original.a]},correct=l.a[l.ok];for(let i=l.a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l.a[i],l.a[j]]=[l.a[j],l.a[i]]}l.ok=l.a.indexOf(correct);return l}
function start(course=currentCourse,asGuided=false){diagnosticMode=false;guidedMode=asGuided;currentCourse=course;lessons=lessonBanks[course].steps.map(shuffleStep);step=0;mistakes=0;reviewQueue=[];reviewKeys=new Set();completedSteps=new Set();render()}
function backStep(){if(diagnosticMode){home();return}if(step>0){step--;render()}else home()}
function render(){
 const l=lessons[step],done=completedSteps.has(step);locked=done;questionStarted=Date.now();hintUsed=false;explainIndex=0;explanationStyles=[];bar.style.width=((step+1)/lessons.length*100)+'%';
 if(diagnosticMode){
  screen.innerHTML=`<div class="eyebrow">Placement question ${step+1} of ${lessons.length} · ${l.tag}</div><div class="diagNote">No hints, lesson preview, or correctness feedback is shown during placement. Work from what you already know.</div><h1>${l.q}</h1><div class="formula">${paintFormula(l.formula,l.tag)}</div><div class="answers">${l.a.map((x,i)=>`<button class="choice" onclick="diagnosticPick(${i})"><b>${String.fromCharCode(65+i)}</b><span>${x}</span></button>`).join('')}</div>${audioEnabled?`<div class="mini"><button id="questionSpeakBtn" onclick="speakQuestionOnly()">🔊 Read question only</button></div>`:''}`;return;
 }
 const pref=preferredExplanation(l),teachText=pref?pref[1]:lessonTeaching(l),teachTitle=pref?pref[0]:'Learn this first';
 screen.innerHTML=`<div class="eyebrow">Step ${step+1} of ${lessons.length} · ${l.tag}</div><div class="teach"><h2>${teachTitle}</h2><p>${teachText}</p><div class="examples"><strong>More than one example:</strong> ${exampleText(l)}</div></div><div class="questionLabel">Now prove you understand it</div><h1>${l.q}</h1><div class="formula">${paintFormula(l.formula,l.tag)}</div><div class="answers">${l.a.map((x,i)=>`<button class="choice ${done&&i===l.ok?'correct':''}" onclick="pick(${i},this)" ${done?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${x}</span></button>`).join('')}</div><div id="coach">${done?`<div class="coach"><strong>Saved as correct.</strong> ${l.why}</div><button class="next" onclick="advance()">Next tiny step</button>`:''}</div><div class="mini">${audioEnabled?`<button id="speakBtn" onclick="speak()">🔊 Read whole lesson</button>`:''}<button onclick="explainAnotherWay()">💡 Explain it another way</button></div>`;
}
function pick(i,el){
 if(locked)return;const l=lessons[step], coach=document.querySelector('#coach');
 saveAttempt(i===l.ok,i,l);
 if(i===l.ok){locked=true;completedSteps.add(step);el.classList.add('correct');coach.innerHTML=`<div class="coach"><strong>That’s it—and your answer is saved.</strong> ${l.why}</div><button class="next" onclick="advance()">Next tiny step</button>`}
 else{mistakes++;const key=l.tag+"|"+l.q;if(!reviewKeys.has(key)){reviewKeys.add(key);reviewQueue.push({...l,tag:"REVIEW · "+l.tag})}el.classList.add('wrong');el.disabled=true;coach.innerHTML=`<div class="coach"><strong>Not quite—and that’s useful.</strong> ${focusHint(l)} You will see this idea again later so we know it stuck.</div>`}
}
function hint(){hintUsed=true;const l=lessons[step],next=locked?'<button class="next" onclick="advance()">Next tiny step</button>':'';document.querySelector('#coach').innerHTML=`<div class="coach"><strong>Hint:</strong> ${focusHint(l)}</div>${next}`}
function explainAnotherWay(){hintUsed=true;const l=lessons[step],next=locked?'<button class="next" onclick="advance()">Next tiny step</button>':'',styles=[["Plain-English breakdown",deepExplain(l)],["Worked example",workedExplain(l)],["Real-life picture",analogyFor(l)+"<br><br><strong>Now connect it:</strong> "+l.why],["Six-step checklist",checklistExplain(l)],["Pattern discovery",exampleText(l)+"<br><br>Compare what changes and what stays constant."],["Why it works",deepExplain(l)+"<br><br><strong>Reasoning:</strong> The rule preserves the mathematical relationship, not one memorized number."],["Mistake-based teaching",focusHint(l)+"<br><br>Now identify the tempting wrong move and explain why it fails."],["Guided questions","What does the main symbol mean?<br>What operation comes first?<br>What stays unchanged?<br>Can you solve only that first step now?"]];const chosen=styles[explainIndex%styles.length];explainIndex++;explanationStyles.push(chosen[0]);document.querySelector('#coach').innerHTML=`<div class="coach"><strong>${chosen[0]} · way ${((explainIndex-1)%styles.length)+1} of ${styles.length}</strong><br><br>${chosen[1]}<br><br><em>Tap again for a genuinely different approach.</em></div>${next}`}
function doSpeak(text,btn,defaultLabel){if(!audioEnabled)return;if(audioSpeaking||nativeSpeaking()||browserSpeaking()){stopAudio();return}try{if(window.AndroidSpeech&&typeof window.AndroidSpeech.speak==="function"){audioSpeaking=true;window.AndroidSpeech.speak(text);if(btn)btn.textContent="⏹ Stop audio";return}if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(text);u.onstart=()=>{audioSpeaking=true;if(btn)btn.textContent="⏹ Stop audio"};u.onend=()=>{audioSpeaking=false;if(btn)btn.textContent=defaultLabel||"🔊 Read whole lesson"};u.onerror=()=>{audioSpeaking=false;if(btn)btn.textContent=defaultLabel||"🔊 Read whole lesson"};speechSynthesis.speak(u);return}}catch(e){}audioSpeaking=false;if(btn)btn.textContent="Audio unavailable"}
function speak(){if(!audioEnabled){stopAudio();return}if(audioSpeaking||nativeSpeaking()||browserSpeaking()){stopAudio();return}const l=lessons[step];const plain=s=>String(s).replace(/<[^>]*>/g,' ').replace(/&gt;/g,' greater than ').replace(/&nbsp;/g,' ');const text="Learn this first. "+plain(lessonTeaching(l))+". Examples. "+plain(exampleText(l))+". Now answer: "+plain(l.q)+". The choices are: "+l.a.map(plain).join(". or ");doSpeak(text,document.querySelector('#speakBtn'),"🔊 Read whole lesson")}
function speakQuestionOnly(){if(!audioEnabled){stopAudio();return}if(audioSpeaking||nativeSpeaking()||browserSpeaking()){stopAudio();return}const l=lessons[step];const plain=s=>String(s).replace(/<[^>]*>/g,' ');doSpeak("Question. "+plain(l.q)+". Choices. "+l.a.map(plain).join('. or '),document.querySelector('#questionSpeakBtn'),"🔊 Read question only")}
function advance(){if(step<lessons.length-1){step++;render()}else if(reviewQueue.length){lessons=lessons.concat(reviewQueue);reviewQueue=[];step++;render()}else finish()}
function finish(){mastered++;localStorage.mathMastered=mastered;if(guidedMode){let i=+(localStorage.guidedIndex||0);localStorage.guidedIndex=Math.min(i+1,guidedOrder.length)}streak.textContent='🔥 '+mastered+' mastered';bar.style.width='100%';const nextGuided=guidedMode&&+(localStorage.guidedIndex||0)<guidedOrder.length?`<button class="next" onclick="startGuided()">Continue to the next guided lesson</button>`:"";screen.innerHTML=`<div class="home"><div class="icon">🏁</div><div class="eyebrow">Lesson mastered</div><h1>You proved that you understand it.</h1><p class="prompt">Anything missed came back for another correct answer before this lesson counted as mastered.</p><div class="scoregrid"><div><b>${lessons.length}</b><small>steps</small></div><div><b>${mistakes}</b><small>learning turns</small></div><div><b>${mastered}</b><small>mastered</small></div></div>${nextGuided}<button class="next quiet" onclick="start(currentCourse,guidedMode)">Practice it again</button><button class="next quiet" onclick="home()">Return to main screen</button></div>`}
function challenge(){const x=2+Math.floor(Math.random()*7),ans=2*x*x-1;screen.innerHTML=`<div class="eyebrow">Fresh problem</div><h1>Use the same steps. What is f(${x})?</h1><div class="formula">f(${x}) = 2(${x})² − 1</div><p class="prompt">1. Square ${x}<br>2. Multiply by 2<br>3. Subtract 1</p><div class="answers"><button class="choice" onclick="reveal(${ans})"><b>✓</b><span>I worked it out—show the answer</span></button></div><div id="coach"></div>`}
function reveal(a){document.querySelector('#coach').innerHTML=`<div class="coach">The answer is <strong>${a}</strong>. If yours matches, you nailed the whole process.</div><button class="next" onclick="challenge()">Another one</button>`}
streak.textContent='🔥 '+mastered+' mastered';home();
</script></body></html>
