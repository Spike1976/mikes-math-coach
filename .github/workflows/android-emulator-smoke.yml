name: Android emulator launch smoke test
on:
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore test signing key
        run: base64 --decode ci/mikes-math-test.keystore.b64 > ci/mikes-math-test.keystore
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Boot emulator and check first launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.mikesmathcoach.test/com.mikesmathcoach.MainActivity
            sleep 7
            adb shell pidof com.mikesmathcoach.test
            adb shell screencap -p /sdcard/math-coach-screen.png
            adb pull /sdcard/math-coach-screen.png math-coach-screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: math-coach-emulator-smoke-screenshot
          path: math-coach-screen.png
          if-no-files-found: error
