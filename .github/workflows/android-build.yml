name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable test signing key
        run: base64 --decode ci/mikes-math-test.keystore.b64 > ci/mikes-math-test.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Node for source tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run interface and speech regression checks
        run: node --test tests/*.test.cjs

      - name: Build and lint Android app
        run: gradle --no-daemon clean assembleDebug lintDebug bundleRelease

      - name: Verify APK and unsigned release bundle exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mike-Math-Coach-v2.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release bundle for validation only
        uses: actions/upload-artifact@v4
        with:
          name: Mike-Math-Coach-v2.0.0-UNSIGNED-NOT-FOR-PLAY
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
