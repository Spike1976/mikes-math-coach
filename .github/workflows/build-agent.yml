name: Math Coach Build Agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1'
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: math-coach-build-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      result: ${{ steps.summary.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore test signing keystore
        run: |
          umask 077
          base64 --decode ci/mikes-math-test.keystore.b64 > ci/mikes-math-test.keystore
      - name: Run automated tests
        run: node --test tests/*.test.cjs
      - name: Build, lint, and check release packaging
        run: gradle --no-daemon --stacktrace clean assembleDebug lintDebug bundleRelease
      - name: Validate outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -f app/build/reports/lint-results-debug.html
      - name: Upload debug APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: math-coach-build-agent-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Summarize successful build
        id: summary
        if: success()
        run: |
          echo "result=passed" >> "$GITHUB_OUTPUT"
          {
            echo "## Mike's Math Coach Build Agent"
            echo "All source tests, Android lint, APK build and release packaging completed."
            echo ""
            echo "**Build:** ${{ github.run_number }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "The release AAB built here is unsigned and NOT ready for Play Store."
            echo "Download the debug APK from this run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record failure
        if: failure()
        run: |
          {
            echo "## Mike's Math Coach Build Agent: FAILURE"
            echo "See the failing step and logs in this run."
            echo "Automatic changes to application code are intentionally disabled."
          } >> "$GITHUB_STEP_SUMMARY"
  report-failure:
    needs: build-agent
    if: always() && needs.build-agent.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update build failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Build Agent: latest Android build failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const issue = issues.find(i => i.title === title && !i.pull_request);
            const body = [
              'Automated build checks failed.',
              '',
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'Commit: ' + context.sha,
              'Review failing step logs. No code or signing credentials were altered by the agent.'
            ].join('\n');
            if (issue) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
